<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Taskbar Legends</title></head>
<body><main id="app" aria-label="Taskbar Legends idle battle"><canvas id="game" role="img" aria-label="Three fantasy heroes battle enemy waves; open management from the HUD"></canvas><div id="controls"></div><div id="live-status" class="sr-only" role="status" aria-live="polite"></div><div id="notice" role="status"></div><div id="compact-menu-bar" hidden><button id="compact-menu-button" type="button">Menu</button><button id="compact-edit-button" type="button">Edit</button></div><div id="edit-overlay" hidden aria-label="Window editing controls"><div class="edit-frame"><button id="drag-handle" type="button" aria-label="Drag window">Move</button><button id="resize-handle" type="button" aria-label="Resize window">Resize</button><button id="edit-done" type="button">Done</button></div></div><section id="management" aria-label="Management" hidden></section><section id="save-recovery" aria-labelledby="save-recovery-title" hidden><h1 id="save-recovery-title">Save could not be loaded</h1><p id="recovery-description">The saved data is preserved. Export it for recovery, or discard it to start fresh. Autosaving is paused until you choose.</p><div id="recovery-status" role="status" aria-live="polite"></div><button id="export-failed-save" type="button">Export original save</button><button id="discard-failed-save" type="button">Discard save and start fresh</button></section></main><script type="module" src="/src/bootstrap.ts"></script></body></html>
