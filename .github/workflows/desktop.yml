name: Desktop shell builds
on:
  workflow_dispatch:
  push:
    branches: [m2-tauri-shell]
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/platform/desktop/**'
      - '.github/workflows/desktop.yml'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run native:check && npm run native:test
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: npm run native:check
      - run: npm run native:test
      - name: Build Windows installers (retry transient upstream downloads)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run desktop:build -- --bundles nsis,msi 2>&1 | Tee-Object -FilePath installer-build.log
            $buildExit = $LASTEXITCODE
            if ($buildExit -eq 0) { exit 0 }
            $transient = Select-String -Path installer-build.log -Pattern 'http status: (429|5[0-9][0-9])|operation timed out|connection reset' -Quiet
            if (!$transient -or $attempt -eq 3) { exit $buildExit }
            Write-Output "Transient installer-tool download failure; retrying attempt $($attempt + 1)/3"
            Start-Sleep -Seconds ($attempt * 15)
          }
      - name: Require both installer formats
        shell: pwsh
        run: |
          if (!(Test-Path 'src-tauri/target/release/bundle/nsis/*.exe')) { throw 'NSIS exe missing' }
          if (!(Test-Path 'src-tauri/target/release/bundle/msi/*.msi')) { throw 'MSI missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-legends-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/taskbar-legends.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
