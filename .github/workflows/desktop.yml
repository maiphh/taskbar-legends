name: Desktop shell builds
on:
  workflow_dispatch:
  push:
    branches: [m2-tauri-shell]
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/platform/desktop/**'
      - '.github/workflows/desktop.yml'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run native:check && npm run native:test
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: npm run native:check
      - run: npm run native:test
      - name: Cache verified Tauri bundler downloads
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-windows-tools-v1-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Compile Windows executable once
        run: npm run desktop:build -- --no-bundle
      - name: Bundle each Windows installer (retry transient upstream downloads)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($bundle in @('nsis', 'msi')) {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              npm run tauri -- bundle --bundles $bundle --ci 2>&1 | Tee-Object -FilePath "installer-$bundle.log"
              $buildExit = $LASTEXITCODE
              if ($buildExit -eq 0) { break }
              $transient = Select-String -Path "installer-$bundle.log" -Pattern 'http status: (429|5[0-9][0-9])|operation timed out|connection reset' -Quiet
              if (!$transient -or $attempt -eq 5) { exit $buildExit }
              Write-Output "Transient $bundle tool download failure; retrying attempt $($attempt + 1)/5"
              Start-Sleep -Seconds ($attempt * 15)
            }
          }
          exit 0
      - name: Require both installer formats
        shell: pwsh
        run: |
          if (!(Test-Path 'src-tauri/target/release/bundle/nsis/*.exe')) { throw 'NSIS exe missing' }
          if (!(Test-Path 'src-tauri/target/release/bundle/msi/*.msi')) { throw 'MSI missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-legends-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/taskbar-legends.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run native:check && npm run native:test
      - name: Build universal test app and DMG (ad-hoc only, no Apple identity)
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app,dmg --ci
      - name: Verify both architectures and preserve app permissions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=src-tauri/target/universal-apple-darwin/release/bundle
          APP="$ROOT/macos/Taskbar Legends.app"
          test -d "$APP"
          lipo "$APP/Contents/MacOS/taskbar-legends" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          mkdir -p mac-artifacts
          # upload-artifact does not preserve executable bits or app symlinks.
          ditto -c -k --sequesterRsrc --keepParent "$APP" mac-artifacts/Taskbar-Legends-universal.app.zip
          shopt -s nullglob
          dmgs=("$ROOT"/dmg/*.dmg)
          test "${#dmgs[@]}" -ge 1
          cp "${dmgs[@]}" mac-artifacts/
          shasum -a 256 mac-artifacts/* > mac-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-legends-macos-universal-unsigned
          if-no-files-found: error
          retention-days: 14
          path: mac-artifacts/
