name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Deterministic sim smoke
        run: |
          npm run --silent sim -- --seed 1 --ticks 600 > sim-smoke.json
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('sim-smoke.json','utf8')); if(s.final.tick!==600 || s.final.seed!==1) throw new Error('Invalid smoke result');"
      - name: Aggregate reference CLI smoke
        run: |
          npm run --silent sim -- --policy reference --days 1 --seeds 2 --gacha-seeds 32 > sim-aggregate-smoke.json
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('sim-aggregate-smoke.json','utf8')); if(s.seedCount!==2 || s.targets.length!==7 || !s.targets.every(t=>'p10' in t.distribution && 'median' in t.distribution && 'p90' in t.distribution)) throw new Error('Invalid aggregate smoke');"
      - name: v1.4 rules sim smoke (all rules)
        run: |
          npm run --silent sim -- --seed 1 --hours 1 --v14 all > sim-v14-smoke.json
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('sim-v14-smoke.json','utf8')); if(s.v14Rules.join()!=='chestChoice,farmChest,recruitPity,gearFortune,expeditionChests,offlineTickets' || s.configSha256!=='9f6820e4921cc6d0915a3f5095e60ccee04657dc244747c0df0d6b3e3f38609f' || !(s.events.gear>0)) throw new Error('Invalid v14 smoke');"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-smoke
          path: |
            sim-smoke.json
            sim-v14-smoke.json
      - name: Build relative-path web preview
        run: npx vite build --base ./ --outDir web-preview
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: web-preview
